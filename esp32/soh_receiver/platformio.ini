; Alıcı sketch klasörünü PlatformIO projesi olarak açmak için yapılandırma.
[platformio]
; Kaynak .ino ve başlıklar mevcut klasörde; src klasörüne taşımak gerekmez.
src_dir = .

[env:esp32dev]
; ESP32-WROOM-32D içeren yaygın 4 MB geliştirme kartı için genel profil.
platform = espressif32
board = esp32dev
; Arduino-ESP32 zaten FreeRTOS içerir.
framework = arduino
; NRF24 sürücüsünü PlatformIO otomatik indirir.
lib_deps = nrf24/RF24
; PlatformIO .ino dosyasını derlemeden önce .ino.cpp dosyasına dönüştürür.
; Her iki adı da dahil et; yalnız .ino filtresi dönüştürülen kaynağı dışarıda bırakır.
build_src_filter = +<soh_receiver.ino> +<soh_receiver.ino.cpp>
monitor_speed = 115200
upload_speed = 115200
; İki kart aynı anda bağlıysa kendi COM numaranla aşağıdaki satırları etkinleştir.
; upload_port = COM6
; monitor_port = COM6
